<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Newport News Housing Hub</title>
    <meta name="description" content="Newport News Housing Hub — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Newport News Housing Hub" />
    <meta property="og:description" content="Newport News Housing Hub — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Newport News Housing Hub" />
    <meta name="twitter:description" content="Newport News Housing Hub — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Accessibility widget mounts here, outside #root, so CSS filters applied
         to #root for high-contrast mode never hide or distort the widget. -->
    <div id="a11y-root"></div>
    <!-- City overlay: sibling of #root, outside the React app tree.
         position:fixed here so no React transform can ever break child fixed/absolute positioning. -->
    <div id="city-overlay" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9960;overflow:visible;"></div>
    <!-- pointer-events:none stays on the container; the ticker's close button re-enables itself via pointer-events:auto on the button element -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
